# XcodeGen spec - the .xcodeproj is GENERATED from this file (`just gen`) and
# committed so CI can build without xcodegen. Edit here, never in Xcode's
# project editor.
name: Receptor
options:
  deploymentTarget:
    iOS: "18.0"    # ControlWidget (Control Center) needs 18
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2.0.4
    # Team is injected on the command line (justfile / CI); never committed.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
targets:
  Receptor:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Receptor, Shared]
    dependencies:
      - target: ReceptorShare
        platformFilter: iOS
      - target: ReceptorSend
        platformFilter: iOS
      - target: ReceptorPrefilled
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor
        PRODUCT_NAME: Receptor
        # XcodeGen leaves SUPPORTED_PLATFORMS empty for multi-destination targets
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Receptor/Receptor.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Receptor/Receptor-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
      configs:
        Release:
          # Ad Hoc profile per target - `just deploy` only flips CODE_SIGN_STYLE
          # to Manual; the names live here because one CLI override cannot
          # name three profiles.
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Receptor Ad Hoc
    info:
      path: Receptor/Info.plist
      properties:
        CFBundleDisplayName: Receptor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        BGTaskSchedulerPermittedIdentifiers: [com.alexmiller.receptor.sync]
        ITSAppUsesNonExemptEncryption: false
        # receptor://compose (open a new thought) and
        # receptor://recept?text=...&source=... (queue + send) - see Shared/DeepLink.swift
        CFBundleURLTypes:
          - CFBundleURLName: com.alexmiller.receptor
            CFBundleURLSchemes: [receptor]
  # Share-sheet ACTION extensions (the list below the app row), one entry per
  # capture mode, mirroring the three Shortcuts they replace. Share extensions
  # would land in the app row instead - keep these as ui-services. iOS draws an
  # action's icon as a template silhouette from the EXTENSION's own AppIcon
  # (ExtensionAssets) - without one the entry is a blank black square.
  ReceptorShare:
    type: app-extension
    platform: iOS
    sources: [ReceptorShare, Shared, ExtensionAssets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor.share
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        PRODUCT_NAME: ReceptorShare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shared/Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Receptor Share Ad Hoc
    info:
      path: ReceptorShare/Info.plist
      properties:
        CFBundleDisplayName: "Receptor 📤 💭"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContextViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  ReceptorSend:
    type: app-extension
    platform: iOS
    sources: [ReceptorSend, Shared, ExtensionAssets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor.send
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        PRODUCT_NAME: ReceptorSend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shared/Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Receptor Send Ad Hoc
    info:
      path: ReceptorSend/Info.plist
      properties:
        CFBundleDisplayName: "Receptor 📥"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SendRequestHandler
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  ReceptorPrefilled:
    type: app-extension
    platform: iOS
    sources: [ReceptorPrefilled, Shared, ExtensionAssets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor.prefilled
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        PRODUCT_NAME: ReceptorPrefilled
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shared/Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Receptor Prefilled Ad Hoc
    info:
      path: ReceptorPrefilled/Info.plist
      properties:
        CFBundleDisplayName: "Pre-filled Receptor 📤"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrefilledRequestHandler
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # Unit tests for the pure Shared/ logic (deep links, configuration).
  ReceptorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReceptorTests]
    dependencies:
      - target: Receptor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor.tests
        PRODUCT_NAME: ReceptorTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen sets TEST_HOST from the dependency but not the loader
        BUNDLE_LOADER: $(TEST_HOST)
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
  # Drives the share sheet on a simulator and screenshots each step.
  ReceptorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReceptorUITests]
    dependencies:
      - target: Receptor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.receptor.uitests
        PRODUCT_NAME: ReceptorUITests
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TEST_TARGET_NAME: Receptor
schemes:
  Receptor:
    build:
      targets:
        Receptor: all
        ReceptorTests: [test]
        ReceptorUITests: [test]
    test:
      targets: [ReceptorTests, ReceptorUITests]
